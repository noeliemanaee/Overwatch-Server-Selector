name: Build Windows exe

# Builds "MINA Overwatch 2 Server Selector.exe" on a Windows machine at every push to main,
# then publishes it as a release so it can be downloaded from the Releases page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller pywin32 pillow requests urllib3 pythonping

      - name: Build exe
        run: pyinstaller Overwatch-Server-Selector.exe.spec

      - uses: actions/upload-artifact@v4
        with:
          name: MINA-Overwatch-2-Server-Selector-login-fix
          path: dist/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.3.1-loginfix-${{ github.run_number }}
          name: 5.3.1 + login fix (build ${{ github.run_number }})
          body: Blocks only game traffic (UDP/ICMP) so logging in keeps working when AMS1 is blocked.
          files: dist/*.exe
